<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – Purley Sports Club Padel League</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 flex flex-col">

    <div class="bg-[#C25C89] text-white p-6 shadow-lg">
      <div class="flex items-center gap-4">
        <img src="PSC LOGO HIGH QUALITY (1).png" alt="Purley Sports Club logo" class="h-12 w-auto" />
        <div>
          <h1 class="text-3xl font-bold">Purley Sports Club – Padel League</h1>
          <p class="text-pink-100 mt-1">Leagues - 2026</p>
        </div>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-sm">
        <div class="bg-white rounded-lg shadow overflow-hidden">

          <!-- Tabs -->
          <div class="flex border-b">
            <button id="tab-signin" onclick="showTab('signin')"
              class="flex-1 py-3 px-4 font-medium text-sm border-b-2 border-[#C25C89] text-[#C25C89]">
              Sign In
            </button>
            <button id="tab-signup" onclick="showTab('signup')"
              class="flex-1 py-3 px-4 font-medium text-sm text-gray-500 hover:text-gray-700">
              Create Account
            </button>
          </div>

          <div class="p-8">
            <!-- Sign In -->
            <div id="panel-signin">
              <div id="signin-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
              <form id="signin-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                  <input id="signin-username" type="text" autocomplete="username"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                    placeholder="Enter your username" required />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                  <input id="signin-password" type="password" autocomplete="current-password"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                    placeholder="Enter your password" required />
                </div>
                <button type="submit" id="signin-btn"
                  class="w-full bg-[#C25C89] text-white py-2 rounded-lg font-semibold hover:bg-[#b04d79] transition-colors">
                  Sign In
                </button>
              </form>
              <p class="text-center text-sm text-gray-500 mt-6">
                Forgotten your password?
                <a href="/admin.html" class="text-[#C25C89] hover:underline">Contact the administrator</a>
                or ask them to reset it.
              </p>
            </div>

            <!-- Create Account -->
            <div id="panel-signup" class="hidden">
              <div id="signup-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
              <div id="signup-success" class="hidden mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
                Account created! You can now sign in.
              </div>
              <form id="signup-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                  <input id="signup-username" type="text" autocomplete="username"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                    placeholder="Choose a username" required />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                  <input id="signup-password" type="password" autocomplete="new-password"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                    placeholder="At least 6 characters" required />
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Confirm password</label>
                  <input id="signup-confirm" type="password" autocomplete="new-password"
                    class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                    placeholder="Repeat your password" required />
                </div>
                <button type="submit" id="signup-btn"
                  class="w-full bg-[#C25C89] text-white py-2 rounded-lg font-semibold hover:bg-[#b04d79] transition-colors">
                  Create Account
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // If already logged in, skip straight to the app
      fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/'; });

      function showTab(tab) {
        ['signin', 'signup'].forEach(t => {
          document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
          const btn = document.getElementById(`tab-${t}`);
          if (t === tab) {
            btn.classList.add('border-b-2', 'border-[#C25C89]', 'text-[#C25C89]');
            btn.classList.remove('text-gray-500');
          } else {
            btn.classList.remove('border-b-2', 'border-[#C25C89]', 'text-[#C25C89]');
            btn.classList.add('text-gray-500');
          }
        });
      }

      // Sign in
      document.getElementById('signin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('signin-btn');
        const errEl = document.getElementById('signin-error');
        btn.disabled = true; btn.textContent = 'Signing in…'; errEl.classList.add('hidden');
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('signin-username').value.trim(),
              password: document.getElementById('signin-password').value
            })
          });
          const data = await res.json();
          if (res.ok) { window.location.href = '/'; }
          else { errEl.textContent = data.error || 'Sign in failed'; errEl.classList.remove('hidden'); }
        } catch { errEl.textContent = 'Could not reach the server.'; errEl.classList.remove('hidden'); }
        finally { btn.disabled = false; btn.textContent = 'Sign In'; }
      });

      // Sign up
      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('signup-btn');
        const errEl = document.getElementById('signup-error');
        const okEl = document.getElementById('signup-success');
        const password = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-confirm').value;
        errEl.classList.add('hidden'); okEl.classList.add('hidden');
        if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; errEl.classList.remove('hidden'); return; }
        if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating account…';
        try {
          const res = await fetch('/api/auth/signup', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('signup-username').value.trim(),
              password
            })
          });
          const data = await res.json();
          if (res.ok) {
            okEl.classList.remove('hidden');
            document.getElementById('signup-form').reset();
            setTimeout(() => showTab('signin'), 1500);
          } else { errEl.textContent = data.error || 'Sign up failed'; errEl.classList.remove('hidden'); }
        } catch { errEl.textContent = 'Could not reach the server.'; errEl.classList.remove('hidden'); }
        finally { btn.disabled = false; btn.textContent = 'Create Account'; }
      });
    </script>
  </body>
</html>
