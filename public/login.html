<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In – Purley Sports Club Padel League</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 flex flex-col">

    <div class="bg-[#C25C89] text-white p-6 shadow-lg">
      <div class="flex items-center gap-4">
        <img src="PSC LOGO HIGH QUALITY (1).png" alt="Purley Sports Club logo" class="h-12 w-auto" />
        <div>
          <h1 class="text-3xl font-bold">Purley Sports Club – Padel League</h1>
          <p class="text-pink-100 mt-1">Leagues - 2026</p>
        </div>
      </div>
    </div>

    <div class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-sm">
        <div class="bg-white rounded-lg shadow p-8">
          <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sign In</h2>

          <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>

          <form id="login-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
              <input
                id="username"
                type="text"
                autocomplete="username"
                class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                placeholder="Enter your username"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
                placeholder="Enter your password"
                required
              />
            </div>
            <button
              type="submit"
              id="submit-btn"
              class="w-full bg-[#C25C89] text-white py-2 rounded-lg font-semibold hover:bg-[#b04d79] transition-colors"
            >
              Sign In
            </button>
          </form>

          <p class="text-center text-sm text-gray-500 mt-6">
            Forgotten your password? Contact the league administrator.
          </p>
        </div>
      </div>
    </div>

    <script>
      // If already logged in, go straight to the app
      fetch('/api/auth/me').then(r => {
        if (r.ok) window.location.href = '/';
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const errEl = document.getElementById('error-msg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Signing in…';
        errEl.classList.add('hidden');

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (res.ok) {
            window.location.href = '/';
          } else {
            errEl.textContent = data.error || 'Sign in failed';
            errEl.classList.remove('hidden');
          }
        } catch {
          errEl.textContent = 'Could not reach the server. Please try again.';
          errEl.classList.remove('hidden');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
