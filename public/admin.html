<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – Purley Sports Club Padel League</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 flex flex-col">

    <div class="bg-[#C25C89] text-white p-6 shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="PSC LOGO HIGH QUALITY (1).png" alt="Purley Sports Club logo" class="h-12 w-auto" />
          <div>
            <h1 class="text-3xl font-bold">Purley Sports Club – Padel League</h1>
            <p class="text-pink-100 mt-1">Admin Panel</p>
          </div>
        </div>
        <a href="/" class="bg-white text-[#C25C89] px-4 py-2 rounded-lg font-medium hover:bg-pink-50 text-sm">← Back to App</a>
      </div>
    </div>

    <!-- Secret gate -->
    <div id="gate" class="flex-1 flex items-center justify-center p-6">
      <div class="w-full max-w-sm bg-white rounded-lg shadow p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-2">Admin Access</h2>
        <p class="text-gray-500 text-sm mb-4">Enter the admin secret to continue.</p>
        <div id="gate-error" class="hidden mb-3 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <input id="secret-input" type="password"
          class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-[#C25C89]"
          placeholder="Admin secret" />
        <button onclick="unlock()"
          class="w-full bg-[#C25C89] text-white py-2 rounded-lg font-semibold hover:bg-[#b04d79]">
          Unlock
        </button>
      </div>
    </div>

    <!-- Admin UI (hidden until unlocked) -->
    <div id="admin-ui" class="hidden flex-1 max-w-3xl mx-auto w-full p-6 space-y-6">

      <!-- Create user -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Create User</h2>
        <div id="create-msg" class="hidden mb-3 p-3 rounded-lg text-sm"></div>
        <div class="flex gap-3 flex-wrap">
          <input id="new-username" type="text" placeholder="Username"
            class="border rounded-lg px-3 py-2 flex-1 min-w-0 focus:outline-none focus:ring-2 focus:ring-[#C25C89]" />
          <input id="new-password" type="password" placeholder="Password (min 6 chars)"
            class="border rounded-lg px-3 py-2 flex-1 min-w-0 focus:outline-none focus:ring-2 focus:ring-[#C25C89]" />
          <button onclick="createUser()"
            class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium">
            Create
          </button>
        </div>
      </div>

      <!-- User list -->
      <div class="bg-white rounded-lg shadow p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-gray-800">Users</h2>
          <button onclick="loadUsers()" class="text-sm text-[#C25C89] hover:underline">Refresh</button>
        </div>
        <div id="user-list">
          <p class="text-gray-400 text-sm">Loading…</p>
        </div>
      </div>

    </div>

    <!-- Reset password modal -->
    <div id="reset-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
      <div class="w-full max-w-sm bg-white rounded-lg shadow-xl p-6">
        <h3 class="text-lg font-bold mb-1">Reset Password</h3>
        <p class="text-sm text-gray-500 mb-4">Setting new password for: <strong id="reset-username-label"></strong></p>
        <div id="reset-error" class="hidden mb-3 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <input id="reset-password" type="password" placeholder="New password (min 6 chars)"
          class="w-full border rounded-lg px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-[#C25C89]" />
        <div class="flex gap-2 justify-end">
          <button onclick="closeResetModal()" class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200">Cancel</button>
          <button onclick="submitReset()" class="px-4 py-2 rounded-lg bg-[#C25C89] text-white hover:bg-[#b04d79]">Save</button>
        </div>
      </div>
    </div>

    <script>
      let adminSecret = '';
      let resetTarget = '';

      function unlock() {
        const secret = document.getElementById('secret-input').value.trim();
        if (!secret) return;
        // Test the secret by trying to list users
        fetch('/api/admin/users', { headers: { 'X-Admin-Secret': secret } })
          .then(r => {
            if (r.status === 403) {
              const e = document.getElementById('gate-error');
              e.textContent = 'Incorrect admin secret.';
              e.classList.remove('hidden');
              return null;
            }
            return r.json();
          })
          .then(data => {
            if (!data) return;
            adminSecret = secret;
            document.getElementById('gate').classList.add('hidden');
            document.getElementById('admin-ui').classList.remove('hidden');
            document.getElementById('admin-ui').classList.add('flex-1');
            renderUsers(data);
          });
      }

      document.getElementById('secret-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') unlock();
      });

      function loadUsers() {
        fetch('/api/admin/users', { headers: { 'X-Admin-Secret': adminSecret } })
          .then(r => r.json())
          .then(renderUsers);
      }

      function renderUsers(users) {
        const el = document.getElementById('user-list');
        if (!users.length) { el.innerHTML = '<p class="text-gray-400 text-sm">No users yet.</p>'; return; }
        el.innerHTML = `
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="px-3 py-2 text-left font-semibold">Username</th>
                <th class="px-3 py-2 text-left font-semibold">Created</th>
                <th class="px-3 py-2 text-left font-semibold">Last login</th>
                <th class="px-3 py-2 text-center font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr class="border-b hover:bg-gray-50">
                  <td class="px-3 py-3 font-medium">${esc(u.username)}</td>
                  <td class="px-3 py-3 text-gray-500">${fmt(u.created_at)}</td>
                  <td class="px-3 py-3 text-gray-500">${u.last_login ? fmt(u.last_login) : '—'}</td>
                  <td class="px-3 py-3 text-center">
                    <div class="flex justify-center gap-2">
                      <button onclick="openResetModal('${esc(u.username)}')"
                        class="px-3 py-1 rounded bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs font-medium">
                        Reset password
                      </button>
                      <button onclick="deleteUser('${esc(u.username)}')"
                        class="px-3 py-1 rounded bg-red-100 hover:bg-red-200 text-red-700 text-xs font-medium">
                        Delete
                      </button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }

      function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
      function fmt(d) { return d ? new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—'; }

      async function createUser() {
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value;
        const msgEl = document.getElementById('create-msg');
        msgEl.classList.add('hidden');
        if (!username || !password) { showMsg(msgEl, 'Both fields are required.', false); return; }
        const res = await fetch('/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': adminSecret },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(msgEl, `User "${data.username}" created.`, true);
          document.getElementById('new-username').value = '';
          document.getElementById('new-password').value = '';
          loadUsers();
        } else { showMsg(msgEl, data.error || 'Failed to create user.', false); }
      }

      async function deleteUser(username) {
        if (!confirm(`Delete user "${username}"? They will need to create a new account.`)) return;
        const res = await fetch(`/api/admin/users/${encodeURIComponent(username)}`, {
          method: 'DELETE', headers: { 'X-Admin-Secret': adminSecret }
        });
        if (res.ok) loadUsers();
        else alert('Failed to delete user.');
      }

      function openResetModal(username) {
        resetTarget = username;
        document.getElementById('reset-username-label').textContent = username;
        document.getElementById('reset-password').value = '';
        document.getElementById('reset-error').classList.add('hidden');
        document.getElementById('reset-modal').classList.remove('hidden');
      }

      function closeResetModal() {
        document.getElementById('reset-modal').classList.add('hidden');
        resetTarget = '';
      }

      async function submitReset() {
        const password = document.getElementById('reset-password').value;
        const errEl = document.getElementById('reset-error');
        errEl.classList.add('hidden');
        if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
        const res = await fetch(`/api/admin/users/${encodeURIComponent(resetTarget)}/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': adminSecret },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (res.ok) { closeResetModal(); alert(`Password reset for ${resetTarget}.`); }
        else { errEl.textContent = data.error || 'Reset failed.'; errEl.classList.remove('hidden'); }
      }

      function showMsg(el, text, ok) {
        el.textContent = text;
        el.className = `mb-3 p-3 rounded-lg text-sm ${ok ? 'bg-green-50 border border-green-200 text-green-700' : 'bg-red-50 border border-red-200 text-red-700'}`;
        el.classList.remove('hidden');
      }
    </script>
  </body>
</html>
